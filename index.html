<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 페이지 제목 (브라우저 탭 + 스크린 리더)
       스크린 리더 사용자가 처음 페이지에 접속했을 때 가장 먼저 듣는 정보입니다.
       "Contact Form" 이라고 명확히 명시해 목적지를 즉각 파악하게 합니다. -->
  <title>Contact Form</title>

  <!-- SEO: 검색 엔진이 이 페이지를 인덱싱할 때 사용하는 설명입니다.
       구글 검색 결과에서 제목 아래에 이 문구가 표시됩니다. -->
  <meta name="description" content="고객 문의 및 지원 요청을 위한 연락처 폼 페이지입니다.">

  <!-- 구글 폰트 (Karla 400 / 700)
       preconnect: 폰트 서버와 미리 연결을 맺어 로딩 시간을 단축합니다.
       display=swap: 폰트 로딩 중 기본 폰트를 먼저 보여주고 로딩 완료 후 교체,
       사용자가 빈 화면 대신 텍스트를 즉시 볼 수 있어 체감 속도가 개선됩니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap" rel="stylesheet">

  <!-- 스타일시트: 디자인 토큰(CSS 변수), 레이아웃, 컴포넌트 스타일 담당 -->
  <link rel="stylesheet" href="styles.css">

  <!-- 자바스크립트 (defer 속성)
       defer: HTML을 전부 파싱한 뒤 스크립트를 실행합니다.
       [Why] defer 없이 <head>에 script를 두면, JS가 실행되는 시점에
       아직 form, input 등의 DOM 요소가 생성되지 않아 getElementById()가 null을 반환합니다.
       [Result] defer 덕분에 script.js가 DOM이 준비된 상태를 보장받고 안전하게 실행됩니다. -->
  <script src="script.js" defer></script>
</head>

<body>

  <!-- =============================================
       [주요 콘텐츠 영역 시작] <main>
       [Why] <div>가 아닌 <main>을 쓰는 이유:
       스크린 리더는 "메인 콘텐츠로 건너뛰기" 단축키를 제공합니다.
       <main>이 있어야 이 기능이 작동해, 시각 장애인 사용자가 반복되는 내비게이션
       영역을 건너뛰고 핵심 폼으로 바로 이동할 수 있습니다.
       [Result] 스크린 리더 사용자가 "랜드마크: 기본 콘텐츠"라고 바로 인식합니다.
       ============================================= -->
  <main class="page" aria-label="Contact form page">

    <!-- 폼 카드 컨테이너 (.card)
         [Why] <section>은 독립적인 주제를 가진 콘텐츠 블록에 사용하는 시맨틱 태그입니다.
         aria-label로 이름을 부여해 여러 <section>이 있을 때도 스크린 리더가
         "Contact form card 섹션"이라고 구분하여 읽어줄 수 있습니다. -->
    <section class="card" aria-label="Contact form card">

      <!-- 페이지 대제목 <h1>
           [Why] 한 페이지에 <h1>은 단 하나만 사용해야 합니다 (SEO 및 접근성 규칙).
           스크린 리더 사용자는 제목(h1→h6) 키를 눌러 페이지 구조를 파악합니다.
           [Result] "Contact Us, 제목 수준 1" 이라고 읽혀 페이지의 목적을 즉각 전달합니다. -->
      <h1 class="card__title">Contact Us</h1>

      <!-- =============================================
           [폼 영역 시작] <form>
           [Why] novalidate 속성:
           브라우저 내장 유효성 검사를 비활성화합니다. 브라우저 기본 팝업은
           디자인을 제어할 수 없고 접근성도 낮습니다. 대신 JS로 직접 에러 메시지를
           해당 입력창 바로 아래에 표시해 더 나은 UX와 접근성을 제공합니다.
           [Result] 제출 시 브라우저의 노란 말풍선 대신, 커스텀 에러 UI가 표시됩니다.
           ============================================= -->
      <form id="contact-form" class="form" novalidate aria-label="문의 폼">

        <!-- =============================================
             [이름 그룹 fieldset 시작] First Name + Last Name
             [Why] <fieldset>을 쓰는 이유:
             개별 <input> 두 개를 그냥 나열하면, 스크린 리더 사용자는 이 둘이
             "이름"이라는 하나의 주제로 묶인 관계임을 파악하기 어렵습니다.
             <fieldset> + <legend>로 묶으면 "이름 정보 그룹"으로 명확히 전달됩니다.
             [Result] 스크린 리더가 각 필드 진입 시 "이름 정보, 그룹" 이라고 먼저 읽어줍니다.
             ============================================= -->
        <fieldset class="form__name-group" aria-label="이름 입력 그룹">

          <!-- <legend> (sr-only 클래스로 시각적으로 숨김)
               [Why] <fieldset>에는 반드시 <legend>가 있어야 합니다.
               하지만 시각적으로 "이름 정보"라는 제목을 보여줄 필요는 없어
               .sr-only로 화면에는 숨기고 스크린 리더에만 제공합니다.
               [Result] 화면에는 보이지 않지만, 스크린 리더는 "이름 정보" 라고 읽어
               사용자가 이 그룹의 목적을 파악합니다. -->
          <legend class="sr-only">이름 정보</legend>

          <!-- First Name 필드 래퍼 (.form__field)
               라벨 + 입력창 + 에러 메시지를 하나의 단위로 묶습니다. -->
          <div class="form__field">

            <!-- <label for="first-name">
                 [Why] for 속성값과 input의 id값을 일치시켜 명시적으로 연결합니다.
                 [Result 1] 스크린 리더가 "First Name, 필수, 텍스트 입력창" 이라고 읽어줍니다.
                 [Result 2] 라벨 텍스트를 클릭해도 입력창이 포커스 됩니다 (클릭 영역 확대). -->
            <label for="first-name" class="form__label">
              First Name
              <!-- aria-hidden="true": 별표(*)는 시각적 힌트일 뿐입니다.
                   스크린 리더가 "별표"라고 읽는 것을 막습니다.
                   필수 여부는 input의 aria-required="true"가 대신 전달합니다. -->
              <span class="form__required" aria-hidden="true">*</span>
            </label>

            <!-- 텍스트 입력창
                 aria-required="true": 스크린 리더에게 "이 필드는 반드시 채워야 한다"고 알립니다.
                 aria-describedby="first-name-error":
                 [Why] 에러가 발생했을 때 어떤 설명문이 이 입력창과 관련있는지 미리 연결해둡니다.
                 [Result] 유효성 검사 실패 후 이 입력창에 포커스하면, 스크린 리더가
                 입력창 설명에 이어서 "This field is required" 에러 메시지를 자동으로 읽어줍니다. -->
            <input type="text" id="first-name" name="first-name" class="form__input" autocomplete="given-name"
              aria-required="true" aria-describedby="first-name-error">

            <!-- 에러 메시지 (hidden 속성으로 기본 숨김)
                 role="alert": 이 요소가 나타나는 순간, 스크린 리더가 현재 읽던 것을 멈추고
                 즉시 이 경고 메시지를 읽어줍니다 (긴급 알림 역할).
                 [Result] JS에서 hidden 제거 시 → 스크린 리더가 "This field is required" 를 즉시 낭독합니다. -->
            <p id="first-name-error" class="form__error" role="alert" hidden>
              This field is required
            </p>
          </div>

          <!-- Last Name 필드 (First Name과 동일한 구조) -->
          <div class="form__field">
            <label for="last-name" class="form__label">
              Last Name <span class="form__required" aria-hidden="true">*</span>
            </label>
            <input type="text" id="last-name" name="last-name" class="form__input" autocomplete="family-name"
              aria-required="true" aria-describedby="last-name-error">
            <p id="last-name-error" class="form__error" role="alert" hidden>
              This field is required
            </p>
          </div>
        </fieldset>
        <!-- [이름 그룹 fieldset 끝] -->

        <!-- =============================================
             Email Address 필드
             type="email": 모바일 기기에서는 자동으로 @ 키가 포함된 키보드를 띄워줍니다.
             하지만 이것만으로 형식 검사를 신뢰할 수 없어 JS 정규식 검사를 별도로 수행합니다.
             ============================================= -->
        <div class="form__field">
          <label for="email" class="form__label">
            Email Address <span class="form__required" aria-hidden="true">*</span>
          </label>
          <input type="email" id="email" name="email" class="form__input" autocomplete="email" aria-required="true"
            aria-describedby="email-error">

          <!-- 에러 메시지: 단순히 "비어있음" 뿐 아니라, 형식 오류(예: "abc@") 시에도 표시됩니다.
               [Result] 포커스 시 스크린 리더가 "Please enter a valid email address" 를 읽어줍니다. -->
          <p id="email-error" class="form__error" role="alert" hidden>
            Please enter a valid email address
          </p>
        </div>

        <!-- =============================================
             [Query Type - 라디오 버튼 그룹 시작]
             [Why] 라디오 버튼처럼 "여럿 중 하나를 선택"하는 UI에는
             <fieldset> + <legend>가 반드시 필요합니다.
             개별 라디오 label이 "General Enquiry"라고만 읽히면, 스크린 리더 사용자는
             무엇을 선택하는 것인지 맥락을 잃게 됩니다.
             [Result] 라디오 버튼 진입 시 "Query Type, 그룹 → General Enquiry, 선택 안 됨"
             처럼 맥락 + 선택지를 세트로 읽어줍니다.

             aria-describedby="query-type-error":
             [Result] 라디오를 선택하지 않고 제출하면 fieldset 포커스 시
             "Please select a query type" 에러 메시지가 함께 읽힙니다.
             ============================================= -->
        <fieldset class="form__field" aria-describedby="query-type-error">
          <legend class="form__label">
            Query Type <span class="form__required" aria-hidden="true">*</span>
          </legend>

          <div class="form__radio-group">

            <!-- 라디오 옵션 1: General Enquiry
                 [Why] <input>을 <label> 안에 넣는 암묵적 연결 방식을 사용합니다.
                 for/id 명시적 연결과 동일한 접근성 효과를 제공하면서,
                 라디오+텍스트 박스 전체를 클릭 가능한 영역으로 만들어 UX를 개선합니다. -->
            <label for="general-enquiry" class="form__radio-label">
              <input type="radio" id="general-enquiry" name="query-type" value="general-enquiry" class="form__radio"
                aria-required="true">
              General Enquiry
            </label>

            <!-- 라디오 옵션 2: Support Request -->
            <label for="support-request" class="form__radio-label">
              <input type="radio" id="support-request" name="query-type" value="support-request" class="form__radio"
                aria-required="true">
              Support Request
            </label>
          </div>

          <!-- 쿼리 타입 에러 메시지
               [Result] role="alert" 덕분에 JS에서 hidden 제거 순간 스크린 리더가
               "Please select a query type" 경고를 즉시 읽어줍니다. -->
          <p id="query-type-error" class="form__error" role="alert" hidden>
            Please select a query type
          </p>
        </fieldset>
        <!-- [Query Type 그룹 끝] -->

        <!-- =============================================
             Message 텍스트에어리어
             rows="6": 기본 표시 줄 수를 6줄로 지정합니다.
             CSS의 min-height와 함께 사용해 최소 높이를 보장합니다.
             ============================================= -->
        <div class="form__field">
          <label for="message" class="form__label">
            Message <span class="form__required" aria-hidden="true">*</span>
          </label>

          <!-- form__input--textarea: 텍스트에어리어 전용 Modifier 클래스.
               기본 .form__input 스타일을 상속받으면서, resize: vertical 등을 추가로 적용합니다. -->
          <textarea id="message" name="message" class="form__input form__input--textarea" rows="6" aria-required="true"
            aria-describedby="message-error"></textarea>
          <p id="message-error" class="form__error" role="alert" hidden>
            This field is required
          </p>
        </div>

        <!-- =============================================
             [동의 체크박스 영역]
             [Why] <span class="checkbox-text">로 텍스트와 별표를 함께 묶은 이유:
             모바일에서 "I consent to being contacted by the team *" 텍스트가
             줄바꿈될 때 별표(*)가 다음 줄 맨 앞으로 튀어나오는 레이아웃 깨짐을 방지합니다.
             span으로 묶으면 텍스트와 별표가 항상 붙어서 함께 줄바꿈됩니다.
             ============================================= -->
        <div class="form__field form__field--checkbox">
          <label for="consent" class="form__checkbox-label">

            <!-- 체크박스: aria-required="true"로 필수 약관 동의임을 명시합니다.
                 aria-describedby="consent-error":
                 [Result] 미체크 상태로 제출 시 포커스 이동과 함께
                 "To submit this form, please consent to being contacted" 가 낭독됩니다. -->
            <input type="checkbox" id="consent" name="consent" class="form__checkbox" aria-required="true"
              aria-describedby="consent-error">

            <span class="checkbox-text">
              I consent to being contacted by the team
              <span class="form__required" aria-hidden="true">*</span>
            </span>
          </label>

          <p id="consent-error" class="form__error" role="alert" hidden>
            To submit this form, please consent to being contacted
          </p>
        </div>

        <!-- =============================================
             제출 버튼
             type="submit": 클릭 시 상위 <form>의 'submit' 이벤트를 발생시킵니다.
             id="submit-btn": JS 또는 브라우저 테스트 도구에서 이 버튼을 특정할 수 있습니다.
             ============================================= -->
        <button type="submit" id="submit-btn" class="form__submit-btn">
          Submit
        </button>

      </form>
      <!-- [폼 영역 끝] </form> -->

    </section>

  </main>
  <!-- [주요 콘텐츠 영역 끝] </main> -->

  <!-- =============================================
       [성공 토스트 알림 영역 시작] .toast-container
       [Why] <main> 밖에 위치시킨 이유:
       토스트는 폼 제출 흐름과 독립적으로 화면 최상단에 고정(fixed)됩니다.
       <main> 안에 두면 스크롤 위치나 레이아웃에 영향을 받을 수 있어 분리했습니다.

       aria-live="polite":
       [Why] 제출 성공 시 토스트의 hidden이 해제되어 DOM에 내용이 추가됩니다.
       aria-live="polite"는 이 변화를 감지해 스크린 리더에게 알립니다.
       "polite"는 현재 읽던 내용을 끝낸 뒤 알림을 읽어주라는 의미입니다.
       [Result] 시각 장애인 사용자도 "Message Sent! Thanks for completing the form..."
       이라는 성공 피드백을 화면을 보지 않고 음성으로 확인할 수 있습니다.

       aria-atomic="true":
       [Why] 토스트 내부의 일부가 아닌, 전체 블록을 하나의 메시지로 읽도록 강제합니다.
       [Result] 아이콘·제목·본문이 분리되어 읽히지 않고 의미 있는 하나의 단위로 낭독됩니다.

       hidden: JS에서 submitEl.removeAttribute('hidden')으로만 표시됩니다.
       ============================================= -->
  <div class="toast-container">
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden>

      <!-- 토스트 헤더: 체크 아이콘 + "Message Sent!" 제목 -->
      <div class="toast__header">

        <!-- 장식용 아이콘 (aria-hidden="true")
             [Why] 이 SVG 이미지는 "성공"을 시각적으로만 강조하는 장식 요소입니다.
             alt="" 또는 aria-hidden="true"가 없으면 스크린 리더가
             파일명("icon-success-check")을 그대로 읽어 혼란을 줍니다.
             [Result] 스크린 리더가 이 이미지를 건너뛰고, 바로 "Message Sent!" 제목만 읽습니다. -->
        <img src="assets/images/icon-success-check.svg" alt="" class="toast__icon" aria-hidden="true">
        <h2 class="toast__title">Message Sent!</h2>
      </div>

      <!-- 토스트 본문: 성공 후 안내 문구 -->
      <p class="toast__body">Thanks for completing the form. We'll be in touch soon!</p>
    </div>
  </div>
  <!-- [성공 토스트 알림 영역 끝] .toast-container -->

</body>

</html>
